    <div class="login-container">
        <div class="login">
            <h2 class="login-title">LOGIN TO YOUR ACCOUNT</h2>
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <input id="email" type="text" placeholder="Email Address" required>
                    <a href="#" class="forgot-link">Forgot Your Email?</a>
                </div>
                <div class="form-group">
                    <input id="password" type="password" placeholder="Password" required>
                    <a href="./forgot.html" class="forgot-link">Forgot Your Password?</a>
                </div>
                <button type="submit" class="login-button">Login</button>
            </form>
            <div id="g_id_onload"
                data-client_id='647768749306-m8ocoj8f7kocbh103u7b021ch76gt9k0.apps.googleusercontent.com'
                data-context="signin"
                data-ux_mode="popup"
                data-login_uri="http://localhost:5000/login"
                data-auto_prompt="false">
            </div>
            <div class="g_id_signin"
                data-type="standard"
                data-shape="rectangular"
                data-theme="outline"
                data-text="signin_with"
                data-size="large"
                data-logo_alignment="left">
            </div>
            <script>
                function handleCredentialResponse(response) {
                    // Send the token to your backend
                    fetch('/api/auth/google', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            credential: response.credential
                        })
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            window.location.href = '/home.html';
                        } else {
                            console.error('Authentication failed:', data.error);
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                    });
                }
            </script>
        </div>
